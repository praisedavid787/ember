name: Create Production Builds

# Run on version tag pushes only (e.g. v1.0.0), not on every commit — keeps
# builds intentional. Requires the repo to be connected to the EAS project on
# expo.dev (Expo GitHub App installed + repo linked).
on:
  push:
    tags:
      - v*

jobs:
  build_android:
    type: build # Builds an installable Android APK (preview profile = apk)
    params:
      platform: android
      profile: preview
